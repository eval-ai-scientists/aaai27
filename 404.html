<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Evaluating AI Scientists, AAAI-27 Workshop</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Inlined, because a 404 can be served from any path depth. */
  :root { --primary:#4a76c8; --primary-dark:#33569c; --ink:#1d2438; --body:#4a5468; --panel:#f2f3fb; --muted:#7b859b; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:40px 20px; background:#fff; color:var(--body);
    font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.7; text-align:center;
  }
  .wrap { max-width:560px; }
  .mark { width:64px; height:64px; margin:0 auto 28px; display:block; }
  .code { font-size:13px; font-weight:600; letter-spacing:1.8px; text-transform:uppercase; color:var(--primary); margin-bottom:14px; }
  h1 { font-size:32px; line-height:1.25; color:var(--ink); margin:0 0 16px; font-weight:600; }
  p { margin:0 0 28px; }
  .links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  a.btn {
    display:inline-block; padding:12px 26px; border-radius:6px; font-size:15px; font-weight:500;
    text-decoration:none; background:var(--primary); color:#fff; transition:background .2s ease;
  }
  a.btn:hover { background:var(--primary-dark); }
  a.btn.ghost { background:transparent; color:var(--primary); box-shadow:inset 0 0 0 1px var(--primary); }
  a.btn.ghost:hover { background:var(--primary); color:#fff; }
  .foot { margin-top:36px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a86d6"/><stop offset="1" stop-color="#33569c"/></linearGradient></defs>
      <rect width="48" height="48" rx="12" fill="url(#g)"/>
      <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12v9L11.6 35.4A3 3 0 0 0 14.2 40h19.6a3 3 0 0 0 2.6-4.6L29 21v-9"/>
        <path d="M16.5 12h15"/><path d="M19.4 32.6l3.4 3.4 6.6-7"/>
      </g>
    </svg>
    <p class="code">Error 404</p>
    <h1>That page could not be found</h1>
    <p>The link may be out of date, or the page may not have been published at the moment. The workshop home page has everything that is live.</p>
    <div class="links">
      <a class="btn" href="/" data-home>Workshop home</a>
      <a class="btn ghost" href="/calls/" data-home-suffix="calls/">Call for papers</a>
    </div>
    <p class="foot">Evaluating AI Scientists: Benchmarks, Simulation, and Trust. AAAI-27, Montréal.</p>
  </div>

<script>
// GitHub project pages live under /<repo>/, so rebuild the links from the current path.
(function () {
  var parts = location.pathname.split("/").filter(Boolean);
  var base = "/";
  if (parts.length && location.hostname.indexOf("github.io") !== -1) {
    base = "/" + parts[0] + "/";
  }
  var home = document.querySelector("[data-home]");
  if (home) home.setAttribute("href", base);
  var other = document.querySelector("[data-home-suffix]");
  if (other) other.setAttribute("href", base + other.getAttribute("data-home-suffix"));
  var icon = document.querySelector('link[rel="icon"]');
  if (icon) icon.setAttribute("href", base + "assets/img/favicon.svg");
})();
</script>
</body>
</html>
